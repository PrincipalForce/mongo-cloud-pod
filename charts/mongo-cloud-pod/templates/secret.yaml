{{- include "mongo-cloud-pod.validate" . -}}
{{- if not .Values.auth.existingSecret }}
{{- $password := include "mongo-cloud-pod.password" . -}}
{{- $host := include "mongo-cloud-pod.fullname" . -}}
{{- $user := .Values.auth.username -}}
{{- $db := .Values.auth.database -}}
{{/*
The connection string is composed here, once, alongside the password it
contains — see the note in _helpers.tpl on why the password is rendered in
exactly one template.

`authSource=admin` is correct only for mongodb-community, where
MONGO_INITDB_ROOT_* creates the user in the `admin` database. FerretDB
authenticates the Postgres role instead and has no concept of an auth database.
*/}}
{{- $conn := "" -}}
{{- if eq .Values.engine "mongodb-community" -}}
{{- $conn = printf "mongodb://%s:%s@%s:%v/%s?authSource=admin" $user $password $host .Values.service.port $db -}}
{{- else -}}
{{- $conn = printf "mongodb://%s:%s@%s:%v/%s" $user $password $host .Values.service.port $db -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mongo-cloud-pod.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mongo-cloud-pod.labels" . | nindent 4 }}
  annotations:
    {{- include "mongo-cloud-pod.annotations" . | nindent 4 }}
    # The password is read back from this Secret on upgrade. Keeping it when the
    # release is deleted means a reinstall into the same namespace recovers the
    # credential that the retained PVC's data was written with.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  username: {{ $user | quote }}
  password: {{ $password | quote }}
  database: {{ $db | quote }}
  host: {{ $host | quote }}
  port: {{ .Values.service.port | quote }}
  # What an application should consume. Identical shape in both engine modes.
  connectionString: {{ $conn | quote }}
  {{- if eq .Values.engine "ferretdb" }}
  # Internal: how the gateway reaches its storage node. DocumentDB lives in the
  # `postgres` database; the tenant's logical database is created inside it by
  # FerretDB on first write.
  postgresUrl: {{ printf "postgres://%s:%s@%s:5432/postgres" $user $password (include "mongo-cloud-pod.postgresFqdn" .) | quote }}
  {{- end }}
{{- end }}
