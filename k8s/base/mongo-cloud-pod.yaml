    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: mongo-cloud-pod
    mongo-cloud-pod.io/engine: ferretdb
    app.kubernetes.io/component: storage
  annotations:
    
spec:
  # Single writer. DocumentDB stores BSON in regular Postgres tables, so HA
  # here means Postgres HA (streaming replication / CloudNativePG), not more
  # replicas of this StatefulSet — two pods on one RWO volume will not start,
  # and two pods on two volumes are two unrelated databases.
  replicas: 1
  serviceName: mongo-cloud-pod-postgres
  selector:
    matchLabels:
      app.kubernetes.io/name: mongo-cloud-pod
      app.kubernetes.io/instance: mongo-cloud-pod
      app.kubernetes.io/component: storage
  template:
    metadata:
      labels:
        helm.sh/chart: mongo-cloud-pod-0.1.0
        app.kubernetes.io/name: mongo-cloud-pod
        app.kubernetes.io/instance: mongo-cloud-pod
        app.kubernetes.io/version: "2"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: mongo-cloud-pod
        mongo-cloud-pod.io/engine: ferretdb
        app.kubernetes.io/component: storage
      annotations:
        
    spec:
      
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
        runAsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      # Postgres needs time to finish a checkpoint. The default 30s is enough
      # for small databases; raise it if you see "database system was not
      # properly shut down" in the logs after a node drain.
      terminationGracePeriodSeconds: 60
      containers:
        - name: storage
          image: "ghcr.io/ferretdb/postgres-documentdb:17"
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - shared_buffers=256MB
            - -c
            - max_connections=100
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: mongo-cloud-pod
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-cloud-pod
                  key: password
            # Not the tenant's database. DocumentDB installs its extension into
            # `postgres`, and FerretDB creates the tenant's logical database
            # inside it on first write. Pointing this at auth.database leaves
            # the extension in a database the gateway never opens.
            - name: POSTGRES_DB
              value: postgres
            # Keep PGDATA in a subdirectory of the mount: a PVC root often
            # contains lost+found, and initdb refuses a non-empty directory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
