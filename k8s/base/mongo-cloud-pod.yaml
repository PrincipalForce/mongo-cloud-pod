            # $(VAR) expansion, so the username cannot be passed as -U — but
            # libpq reads PGUSER/PGDATABASE from the environment. Without
            # these, pg_isready connects as the non-existent role "postgres"
            # and the server logs a FATAL every ten seconds forever. The probe
            # still passes (the server is accepting connections, which is what
            # it asks), so the only symptom is a log full of authentication
            # failures that look like an intrusion attempt.
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: mongo-cloud-pod
                  key: username
            - name: PGDATABASE
              value: postgres
          startupProbe:
            # initdb plus the DocumentDB extension install can take a while on
            # a cold volume with slow storage. A generous startup probe is what
            # keeps the liveness probe from killing a first boot mid-initdb.
            #
            # No -U: probe exec commands get no $(VAR) expansion from the
            # container's env (unlike command/args), so the username is not
            # available here. pg_isready without it still answers the only
            # question a probe asks — is the server accepting connections.
            exec:
