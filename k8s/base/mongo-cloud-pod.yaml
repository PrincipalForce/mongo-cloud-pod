apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo-cloud-pod-postgres
  namespace: mongo-cloud-pod
  labels:
    helm.sh/chart: mongo-cloud-pod-0.1.0
    app.kubernetes.io/name: mongo-cloud-pod
